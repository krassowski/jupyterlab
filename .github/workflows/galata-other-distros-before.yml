name: UI Tests before the visual testing work

# Runs the Chromium `jupyterlab` project of JupyterLab as it was before the
# visual testing work, the parent of jupyterlab/jupyterlab#18427, against the
# reference screenshots of that commit. The steps follow the galata.yml of
# that commit. Python packages are limited to those uploaded before #18427 was
# merged, the JavaScript packages come from the yarn.lock of that commit, and
# so do Playwright and its Chromium. Reference images are never updated here.
#
# The code under test is checked out at the root, and the measurement scripts
# of this branch in .other-distros-tools.

on:
  # GitHub only dispatches a workflow that has run once, so a change to this
  # file runs the default measurement.
  push:
    branches:
      - other-distros-ui-tests
    paths:
      - .github/workflows/galata-other-distros-before.yml
  workflow_dispatch:
    inputs:
      ref:
        description: Commit of jupyterlab/jupyterlab to test
        required: false
        default: 131cf83388dabd4a4bfc5366a1b3fb455ae39309
        type: string
      cutoff:
        description: Only use Python packages uploaded before this time
        required: false
        default: '2026-02-04T09:27:23+00:00'
        type: string
      platforms:
        description: >-
          JSON list of container platforms, each with id, image and label.
          Empty runs Fedora 44, [] runs none.
        required: false
        default: ''
        type: string
      runners:
        description: >-
          JSON list of GitHub-hosted runners, each with id, runs_on, label and
          install_deps. Empty runs Ubuntu 22.04 and 26.04, [] runs none.
        required: false
        default: ''
        type: string
      test_pattern:
        description: Playwright test name pattern to match (passed to --grep)
        required: false
        default: ''
        type: string
      shards:
        description: Number of shards, 1 or 6
        required: false
        default: '6'
        type: string

permissions: {}

env:
  SHARDS: ${{ inputs.shards == '1' && '1' || '6' }}
  # pip 26.0 and later only consider files uploaded before this time.
  PIP_UPLOADED_PRIOR_TO: ${{ inputs.cutoff || '2026-02-04T09:27:23+00:00' }}

jobs:
  runner:
    name: ${{ matrix.runner.label }} (${{ matrix.shard }}/${{ inputs.shards == '1' && '1' || '6' }})
    if: ${{ (inputs.runners || '') != '[]' }}
    timeout-minutes: 150
    runs-on: ${{ matrix.runner.runs_on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards == '1' && '[1]' || '[1, 2, 3, 4, 5, 6]') }}
        runner: ${{ fromJSON(inputs.runners || '[{"id":"ubuntu2204","runs_on":"ubuntu-22.04","label":"Ubuntu 22.04 runner","install_deps":true},{"id":"ubuntu2604","runs_on":"ubuntu-26.04","label":"Ubuntu 26.04 runner","install_deps":true}]') }}
    steps:
      - name: Checkout the code under test
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: jupyterlab/jupyterlab
          ref: ${{ inputs.ref || '131cf83388dabd4a4bfc5366a1b3fb455ae39309' }}
          persist-credentials: false

      - name: Checkout the measurement scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          path: .other-distros-tools
          persist-credentials: false
          sparse-checkout: |
            galata/snapshot-comparisons-reporter.js
            scripts/describe_rendering_environment.sh
            scripts/run_ui_tests_shard.sh
          sparse-checkout-cone-mode: false

      # The base-setup action as it was on 2026-02-04: Python 3.12, Node 24.
      - name: Base Setup
        uses: jupyterlab/maintainer-tools/.github/actions/base-setup@1f20760badaf1b35d776ad6daa2a3cd469e6c821

      - name: Install dependencies
        run: |
          bash ./scripts/ci_install.sh
          # Build dev-mode
          jlpm run build

      - name: Install ipykernel pre-release that supports subshells (TEMPORARY)
        run: |
          pip install --upgrade --pre "ipykernel<=7.0.0a1"

      - name: Install browser
        env:
          INSTALL_DEPS: ${{ matrix.runner.install_deps }}
        run: |
          set -x
          cd galata
          if [[ "${INSTALL_DEPS}" == "true" ]]; then
            if jlpm playwright install-deps; then
              echo "install-deps: ok" > install-deps.txt
            else
              echo "install-deps: failed" > install-deps.txt
            fi
          else
            echo "install-deps: not run" > install-deps.txt
          fi
          set -e
          # Install only the relevant browser for this matrix job
          jlpm playwright install chromium
          jlpm run build

      - name: Record fonts, libraries and browser
        run: |
          {
            cat galata/install-deps.txt
            pip list 2>/dev/null | grep -i -E '^(jupyterlab|jupyter[-_]server|ipykernel|ipython|notebook|nbconvert|jupyter[-_]client|tornado|pip) ' || true
            bash .other-distros-tools/scripts/describe_rendering_environment.sh
          } 2>&1 | tee galata/environment.txt

      - name: Test
        env:
          SHARD: ${{ matrix.shard }}
          TEST_PATTERN: ${{ inputs.test_pattern }}
          COMPARISON_LABEL: ${{ matrix.runner.label }}
        run: bash .other-distros-tools/scripts/run_ui_tests_shard.sh

      - name: Upload comparison records
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: comparisons-${{ matrix.runner.id }}-${{ matrix.shard }}
          path: |
            galata/environment.txt
            galata/test-results/report.json
            galata/test-results/snapshot-comparisons.json
          if-no-files-found: warn

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-results-${{ matrix.runner.id }}-${{ matrix.shard }}
          path: |
            galata/test-results
            !galata/test-results/**/*.webm
            !galata/test-results/**/*.zip
          if-no-files-found: ignore

      - name: Print JupyterLab logs
        if: ${{ always() }}
        run: cat /tmp/jupyterlab_server.log || true

  distro:
    name: ${{ matrix.platform.label }} (${{ matrix.shard }}/${{ inputs.shards == '1' && '1' || '6' }})
    if: ${{ (inputs.platforms || '') != '[]' }}
    timeout-minutes: 150
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      image: ${{ matrix.platform.image }}
      # Docker gives 64 MB of shared memory by default, which Chromium outgrows.
      options: --shm-size=2g
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards == '1' && '[1]' || '[1, 2, 3, 4, 5, 6]') }}
        platform: ${{ fromJSON(inputs.platforms || '[{"id":"fedora","image":"fedora:44","label":"Fedora 44"}]') }}
    steps:
      - name: Install system packages (Fedora)
        run: |
          set -ex
          cat /etc/os-release
          dnf install -y --allowerasing \
            git curl which findutils procps-ng tar gzip xz unzip diffutils \
            gcc gcc-c++ make \
            python3.12 \
            nodejs24 nodejs24-bin nodejs24-npm nodejs24-npm-bin \
            nss nspr atk at-spi2-atk cups-libs libdrm libxkbcommon \
            libXcomposite libXdamage libXfixes libXrandr mesa-libgbm \
            pango cairo alsa-lib
          # Make Python 3.12 the default interpreter with pip, as setup-python
          # does on the runner.
          python3.12 -m ensurepip --default-pip
          ln -sf /usr/bin/python3.12 /usr/local/bin/python3
          ln -sf /usr/bin/python3.12 /usr/local/bin/python
          # scripts/ci_install.sh of that commit calls sudo, and the steps
          # already run as root.
          printf '#!/bin/sh\nexec "$@"\n' > /usr/local/bin/sudo
          chmod +x /usr/local/bin/sudo

      - name: Checkout the code under test
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: jupyterlab/jupyterlab
          ref: ${{ inputs.ref || '131cf83388dabd4a4bfc5366a1b3fb455ae39309' }}
          persist-credentials: false

      - name: Checkout the measurement scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          path: .other-distros-tools
          persist-credentials: false
          sparse-checkout: |
            galata/snapshot-comparisons-reporter.js
            scripts/describe_rendering_environment.sh
            scripts/run_ui_tests_shard.sh
          sparse-checkout-cone-mode: false

      - name: Configure the container
        run: |
          set -ex
          # The checkouts belong to the runner user and the steps run as root.
          git config --global --add safe.directory '*'
          # Jupyter Server refuses to start as root without this. With
          # --config on the command line, as in `jlpm start`, the server reads
          # jupyter_config.json from the config path but not
          # jupyter_server_config.json.
          mkdir -p ~/.jupyter
          echo '{"ServerApp": {"allow_root": true}}' > ~/.jupyter/jupyter_config.json
          command -v python pip node npm
          python --version
          node --version

      - name: Install dependencies
        run: |
          bash ./scripts/ci_install.sh
          # Build dev-mode
          jlpm run build

      - name: Install ipykernel pre-release that supports subshells (TEMPORARY)
        run: |
          pip install --upgrade --pre "ipykernel<=7.0.0a1"

      # `playwright install-deps` only supports Debian and Ubuntu.
      - name: Install browser
        run: |
          set -ex
          cd galata
          echo "install-deps: not run" > install-deps.txt
          jlpm playwright install chromium
          jlpm run build

      - name: Record fonts, libraries and browser
        run: |
          {
            cat galata/install-deps.txt
            pip list 2>/dev/null | grep -i -E '^(jupyterlab|jupyter[-_]server|ipykernel|ipython|notebook|nbconvert|jupyter[-_]client|tornado|pip) ' || true
            bash .other-distros-tools/scripts/describe_rendering_environment.sh
          } 2>&1 | tee galata/environment.txt

      - name: Test
        env:
          SHARD: ${{ matrix.shard }}
          TEST_PATTERN: ${{ inputs.test_pattern }}
          COMPARISON_LABEL: ${{ matrix.platform.label }}
        run: bash .other-distros-tools/scripts/run_ui_tests_shard.sh

      - name: Upload comparison records
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: comparisons-${{ matrix.platform.id }}-${{ matrix.shard }}
          path: |
            galata/environment.txt
            galata/test-results/report.json
            galata/test-results/snapshot-comparisons.json
          if-no-files-found: warn

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-results-${{ matrix.platform.id }}-${{ matrix.shard }}
          path: |
            galata/test-results
            !galata/test-results/**/*.webm
            !galata/test-results/**/*.zip
          if-no-files-found: ignore

      - name: Print JupyterLab logs
        if: ${{ always() }}
        run: cat /tmp/jupyterlab_server.log || true

  summary:
    name: Count the screenshot comparisons
    needs: [runner, distro]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Download comparison records
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: comparisons-*
          path: comparisons

      - name: Count
        run: |
          python3 scripts/summarise_snapshot_comparisons.py comparisons \
            --control "Ubuntu 22.04 runner" \
            --markdown comparisons/summary.md \
            --json comparisons/summary.json

      - name: Upload the counts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: summary
          path: |
            comparisons/summary.md
            comparisons/summary.json
