name: UI Tests on other Linux distributions

# Runs the Chromium `jupyterlab` project against the committed reference
# screenshots, which the Ubuntu 24.04 runner records, with the userland of
# another Linux distribution. The same tests run on the plain Ubuntu 24.04
# runner as a control, so that flaky tests can be told apart from rendering
# differences. Reference images are only updated when a manual run asks for
# it, and then only as an artifact.
#
# A manual run can test another commit: the code under test is checked out at
# the root, and the measurement scripts of this branch in .other-distros-tools.

on:
  push:
    branches:
      - other-distros-ui-tests
  workflow_dispatch:
    inputs:
      repository:
        description: Repository of the code under test. Empty means this one.
        required: false
        default: ''
        type: string
      ref:
        description: Commit, branch or tag of the code under test. Empty means this commit.
        required: false
        default: ''
        type: string
      platforms:
        description: >-
          JSON list of container platforms, each with id, image, label and
          optionally extra_packages, remove_packages and
          unhint_small_dejavu. Empty runs the default list, [] runs none.
        required: false
        default: ''
        type: string
      runners:
        description: >-
          JSON list of GitHub-hosted runners, each with id, runs_on and
          label. Empty runs the Ubuntu 24.04 control, [] runs none.
        required: false
        default: ''
        type: string
      test_pattern:
        description: Playwright test name pattern to match (passed to --grep)
        required: false
        default: ''
        type: string
      test_args:
        description: More arguments for jlpm test, such as test files
        required: false
        default: ''
        type: string
      shards:
        description: Number of shards, 1 or 6
        required: false
        default: '6'
        type: string
      update_snapshots:
        description: >-
          After the check, run the same tests again with
          --update-snapshots=changed and upload the changed references
        required: false
        default: false
        type: boolean

permissions: {}

env:
  SHARDS: ${{ inputs.shards == '1' && '1' || '6' }}

jobs:
  distro:
    name: ${{ matrix.platform.label }} (${{ matrix.shard }}/${{ inputs.shards == '1' && '1' || '6' }})
    if: ${{ (inputs.platforms || '') != '[]' }}
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      image: ${{ matrix.platform.image }}
      # Docker gives 64 MB of shared memory by default, which Chromium outgrows.
      options: --shm-size=2g
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards == '1' && '[1]' || '[1, 2, 3, 4, 5, 6]') }}
        platform: ${{ fromJSON(inputs.platforms || '[{"id":"fedora","image":"fedora:44","label":"Fedora 44"},{"id":"opensuse","image":"opensuse/tumbleweed:latest","label":"openSUSE Tumbleweed"}]') }}
    steps:
      - name: Install system packages (Fedora)
        if: ${{ startsWith(matrix.platform.image, 'fedora') }}
        run: |
          set -ex
          cat /etc/os-release
          cat /etc/dnf/dnf.conf || true
          dnf install -y --allowerasing \
            git curl which findutils procps-ng tar gzip xz unzip diffutils \
            gcc gcc-c++ make \
            python3.12 \
            nodejs24 nodejs24-bin nodejs24-npm nodejs24-npm-bin \
            nss nspr atk at-spi2-atk cups-libs libdrm libxkbcommon \
            libXcomposite libXdamage libXfixes libXrandr mesa-libgbm \
            pango cairo alsa-lib
          # Make Python 3.12 the default interpreter with pip, as setup-python
          # does on the runner, since the UI tests on main use Python 3.12.
          python3.12 -m ensurepip --default-pip
          ln -sf /usr/bin/python3.12 /usr/local/bin/python3
          ln -sf /usr/bin/python3.12 /usr/local/bin/python

      - name: Install system packages (openSUSE)
        if: ${{ startsWith(matrix.platform.image, 'opensuse') }}
        run: |
          set -ex
          cat /etc/os-release
          grep -E '^\s*solver\.onlyRequires' /etc/zypp/zypp.conf || true
          zypper --non-interactive refresh
          zypper --non-interactive install \
            git-core curl which findutils procps tar gzip xz unzip diffutils \
            gcc gcc-c++ make \
            python312 python312-pip \
            nodejs24 npm24 \
            mozilla-nss mozilla-nspr libatk-1_0-0 libatk-bridge-2_0-0 libcups2 \
            libdrm2 libxkbcommon0 libXcomposite1 libXdamage1 libXfixes3 \
            libXrandr2 libgbm1 libpango-1_0-0 libcairo2 libasound2
          # Make Python 3.12 the default interpreter with pip, as setup-python
          # does on the runner, since the UI tests on main use Python 3.12.
          mkdir -p /usr/local/bin
          ln -sf /usr/bin/python3.12 /usr/local/bin/python3
          ln -sf /usr/bin/python3.12 /usr/local/bin/python
          ln -sf "$(command -v pip3.12)" /usr/local/bin/pip
          # openSUSE marks its Python as externally managed (PEP 668), and
          # scripts/ci_install.sh installs into the system interpreter.
          echo "PIP_BREAK_SYSTEM_PACKAGES=1" >> "${GITHUB_ENV}"
          echo "UV_BREAK_SYSTEM_PACKAGES=1" >> "${GITHUB_ENV}"

      # Only for runs that check a cause, such as a missing font. The default
      # platforms install nothing beyond what the browser libraries pull in.
      # Removal skips the dependency check, so that fontconfig stays installed
      # when the fonts it asks for are removed.
      - name: Change packages for a check
        if: ${{ matrix.platform.extra_packages || matrix.platform.remove_packages }}
        env:
          EXTRA_PACKAGES: ${{ matrix.platform.extra_packages }}
          REMOVE_PACKAGES: ${{ matrix.platform.remove_packages }}
        run: |
          set -ex
          # The lists are split into words on purpose.
          # shellcheck disable=SC2086
          if [[ -n "${EXTRA_PACKAGES}" ]]; then
            if command -v dnf > /dev/null; then
              dnf install -y ${EXTRA_PACKAGES}
            else
              zypper --non-interactive install ${EXTRA_PACKAGES}
            fi
          fi
          # shellcheck disable=SC2086
          if [[ -n "${REMOVE_PACKAGES}" ]]; then
            rpm -e --nodeps ${REMOVE_PACKAGES}
          fi

      # The DejaVu packages of Ubuntu and Fedora ship these rules, and the
      # openSUSE package does not. They turn hinting off for DejaVu below
      # 7.5 pixels, as in fontconfig/20-unhint-small-dejavu-*.conf of
      # https://github.com/dejavu-fonts/dejavu-fonts.
      - name: Add the DejaVu small size rules
        if: ${{ matrix.platform.unhint_small_dejavu }}
        run: |
          set -ex
          for family in 'DejaVu Sans' 'DejaVu Sans Mono' 'DejaVu Serif'; do
            name="$(echo "${family}" | tr '[:upper:] ' '[:lower:]-')"
            cat > "/etc/fonts/conf.d/20-unhint-small-${name}.conf" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE fontconfig SYSTEM "../fonts.dtd">
          <fontconfig>
            <match target="font">
              <test name="family"><string>${family}</string></test>
              <test compare="less" name="pixelsize"><double>7.5</double></test>
              <edit name="hinting"><bool>false</bool></edit>
            </match>
          </fontconfig>
          EOF
          done
          fc-cache -f
          fc-conflist | grep unhint-small

      - name: Checkout the code under test
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Checkout the measurement scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          path: .other-distros-tools
          persist-credentials: false
          sparse-checkout: |
            galata/snapshot-comparisons-reporter.js
            scripts/describe_rendering_environment.sh
            scripts/run_ui_tests_shard.sh
          sparse-checkout-cone-mode: false

      - name: Configure the container
        run: |
          set -ex
          # The checkouts belong to the runner user and the steps run as root.
          git config --global --add safe.directory '*'
          # Jupyter Server refuses to start as root without this. With
          # --config on the command line, as in `jlpm start`, the server reads
          # jupyter_config.json from the config path but not
          # jupyter_server_config.json.
          mkdir -p ~/.jupyter
          echo '{"ServerApp": {"allow_root": true}}' > ~/.jupyter/jupyter_config.json
          command -v python pip node npm
          python --version
          node --version

      - name: Install dependencies
        run: bash ./scripts/ci_install.sh

      - name: Install browser
        run: |
          set -ex
          cd galata
          jlpm playwright install chromium --only-shell

      - name: Build galata
        run: |
          set -ex
          cd galata
          jlpm build

      - name: Record fonts, libraries and browser
        run: bash .other-distros-tools/scripts/describe_rendering_environment.sh 2>&1 | tee galata/environment.txt

      - name: Test
        env:
          SHARD: ${{ matrix.shard }}
          TEST_PATTERN: ${{ inputs.test_pattern }}
          EXTRA_TEST_ARGS: ${{ inputs.test_args }}
          COMPARISON_LABEL: ${{ matrix.platform.label }}
        run: bash .other-distros-tools/scripts/run_ui_tests_shard.sh

      - name: Upload comparison records
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: comparisons-${{ matrix.platform.id }}-${{ matrix.shard }}
          path: |
            galata/environment.txt
            galata/test-results/report.json
            galata/test-results/snapshot-comparisons.json
          if-no-files-found: warn

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-results-${{ matrix.platform.id }}-${{ matrix.shard }}
          path: |
            galata/test-results
            !galata/test-results/**/*.webm
            !galata/test-results/**/*.zip
          if-no-files-found: ignore

      - name: Print JupyterLab logs
        if: ${{ always() }}
        run: cat /tmp/jupyterlab_server.log || true

  runner:
    name: ${{ matrix.runner.label }} (${{ matrix.shard }}/${{ inputs.shards == '1' && '1' || '6' }})
    if: ${{ (inputs.runners || '') != '[]' }}
    timeout-minutes: 90
    runs-on: ${{ matrix.runner.runs_on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards == '1' && '[1]' || '[1, 2, 3, 4, 5, 6]') }}
        runner: ${{ fromJSON(inputs.runners || '[{"id":"ubuntu","runs_on":"ubuntu-24.04","label":"Ubuntu 24.04 runner"}]') }}
    steps:
      - name: Checkout the code under test
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Checkout the measurement scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          path: .other-distros-tools
          persist-credentials: false
          sparse-checkout: |
            galata/snapshot-comparisons-reporter.js
            scripts/describe_rendering_environment.sh
            scripts/run_ui_tests_shard.sh
          sparse-checkout-cone-mode: false

      - name: Base Setup
        uses: jupyterlab/maintainer-tools/.github/actions/base-setup@95d85449e4f3f352e261221f6529f8ed307f5728 # v1
        with:
          python_package_manager: 'uv pip'

      - name: Install dependencies
        run: bash ./scripts/ci_install.sh

      - name: Install browser
        run: |
          set -ex
          cd galata
          jlpm playwright install chromium --only-shell

      - name: Build galata
        run: |
          set -ex
          cd galata
          jlpm build

      - name: Record fonts, libraries and browser
        run: bash .other-distros-tools/scripts/describe_rendering_environment.sh 2>&1 | tee galata/environment.txt

      - name: Test
        env:
          SHARD: ${{ matrix.shard }}
          TEST_PATTERN: ${{ inputs.test_pattern }}
          EXTRA_TEST_ARGS: ${{ inputs.test_args }}
          COMPARISON_LABEL: ${{ matrix.runner.label }}
        run: bash .other-distros-tools/scripts/run_ui_tests_shard.sh

      - name: Upload comparison records
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: comparisons-${{ matrix.runner.id }}-${{ matrix.shard }}
          path: |
            galata/environment.txt
            galata/test-results/report.json
            galata/test-results/snapshot-comparisons.json
          if-no-files-found: warn

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-results-${{ matrix.runner.id }}-${{ matrix.shard }}
          path: |
            galata/test-results
            !galata/test-results/**/*.webm
            !galata/test-results/**/*.zip
          if-no-files-found: ignore

      # The check above uploads its results first, because Playwright empties
      # test-results when it starts again.
      - name: Update the changed references
        if: ${{ !cancelled() && inputs.update_snapshots }}
        env:
          SHARD: ${{ matrix.shard }}
          TEST_PATTERN: ${{ inputs.test_pattern }}
          EXTRA_TEST_ARGS: ${{ inputs.test_args }} --update-snapshots=changed
          COMPARISON_LABEL: ${{ matrix.runner.label }} (update)
        run: |
          bash .other-distros-tools/scripts/run_ui_tests_shard.sh || true
          git status --porcelain -- galata/test
          mkdir -p updated-references
          git status --porcelain -- galata/test | awk '{print $2}' | while read -r file; do
            mkdir -p "updated-references/$(dirname "${file}")"
            cp "${file}" "updated-references/${file}"
          done
          find updated-references -type f

      - name: Upload the update records
        if: ${{ !cancelled() && inputs.update_snapshots }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: update-records-${{ matrix.runner.id }}-${{ matrix.shard }}
          path: |
            galata/test-results/report.json
            galata/test-results/snapshot-comparisons.json
          if-no-files-found: warn

      - name: Upload the updated references
        if: ${{ !cancelled() && inputs.update_snapshots }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: updated-references-${{ matrix.runner.id }}-${{ matrix.shard }}
          path: updated-references
          if-no-files-found: ignore

      - name: Print JupyterLab logs
        if: ${{ always() }}
        run: cat /tmp/jupyterlab_server.log || true

  summary:
    name: Count the screenshot comparisons
    needs: [distro, runner]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Download comparison records
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: comparisons-*
          path: comparisons

      - name: Count
        run: |
          python3 scripts/summarise_snapshot_comparisons.py comparisons \
            --control "Ubuntu 24.04 runner" \
            --markdown comparisons/summary.md \
            --json comparisons/summary.json

      - name: Upload the counts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: summary
          path: |
            comparisons/summary.md
            comparisons/summary.json
