name: Cross-platform Reference Check

# Runs one shard of the UI tests on macOS, Windows and Linux, comparing every
# screenshot against the Linux reference images that the repository ships.
# Push a branch whose name starts with `cross-platform-snapshots` to trigger it.

on:
  push:
    branches:
      - 'cross-platform-snapshots*'
  workflow_dispatch:
    inputs:
      project:
        description: Playwright project to run
        required: false
        default: jupyterlab
        type: choice
        options:
          - jupyterlab
          - galata
      shard:
        description: Shard to run
        required: false
        default: '1'
        type: string
      shards:
        description: Number of shards the suite is split into
        required: false
        default: '6'
        type: string
      reference_platform:
        description: Platform whose reference screenshots to compare against
        required: false
        default: linux
        type: choice
        options:
          - linux
          - darwin
          - win32

permissions: {}

env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers
  GALATA_REFERENCE_PLATFORM: ${{ github.event.inputs.reference_platform || 'linux' }}
  PROJECT: ${{ github.event.inputs.project || 'jupyterlab' }}
  SHARD: ${{ github.event.inputs.shard || '1' }}
  SHARDS: ${{ github.event.inputs.shards || '6' }}

jobs:
  reference-check:
    name: ${{ matrix.label }}
    timeout-minutes: 120
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The control: the same platform the references were recorded on.
          - os: ubuntu-24.04
            label: Ubuntu 24.04 x86_64
          - os: ubuntu-24.04-arm
            label: Ubuntu 24.04 arm64
          - os: macos-latest
            label: macOS
          - os: windows-latest
            label: Windows
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Base Setup
        uses: jupyterlab/maintainer-tools/.github/actions/base-setup@95d85449e4f3f352e261221f6529f8ed307f5728 # v1
        with:
          python_package_manager: 'uv pip'

      - name: Find out Playwright version
        id: pw-version
        shell: bash
        run: |
          set -e
          PW_VERSION=$(grep -m1 '^"playwright@npm:' yarn.lock)
          echo "Playwright version: $PW_VERSION"
          echo "version=$PW_VERSION" >> $GITHUB_OUTPUT

      - name: Set up browser cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ github.workspace }}/pw-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-chromium-${{ steps.pw-version.outputs.version }}

      - name: Install dependencies
        if: ${{ runner.os != 'Windows' }}
        run: bash ./scripts/ci_install.sh

      - name: Install dependencies (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: .\scripts\ci_install
        shell: pwsh

      - name: Install browser
        shell: bash
        run: |
          set -ex
          cd galata
          jlpm playwright install chromium --only-shell

      - name: Build galata
        shell: bash
        run: |
          set -ex
          cd galata
          jlpm build

      - name: Test
        id: test
        shell: bash
        continue-on-error: true
        run: |
          set -ex
          cd galata
          jlpm test \
            -c playwright-cross-platform.config.js \
            --project "${PROJECT}" \
            --shard "${SHARD}/${SHARDS}"

      - name: Inline the report
        if: ${{ !cancelled() }}
        uses: jupyterlab/maintainer-tools/.github/actions/inline-playwright-report@95d85449e4f3f352e261221f6529f8ed307f5728 # v1
        with:
          path: galata/playwright-report

      - name: Upload inlined report
        id: upload-report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          archive: false
          name: reference-check-report-${{ matrix.os }}
          path: galata/playwright-report/output.html

      - name: Add report link to job summary
        if: ${{ !cancelled() }}
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.upload-report.outputs.artifact-url }}
          LABEL: ${{ matrix.label }}
        run: |
          echo "**[View the report for ${LABEL}](${ARTIFACT_URL})**" >> $GITHUB_STEP_SUMMARY

      - name: Summarise the comparison
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python scripts/compare_reference_platforms.py \
            galata/test-results/report.json \
            --label "${{ matrix.label }}, ${PROJECT} shard ${SHARD}/${SHARDS}"

      - name: Upload test assets
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: reference-check-${{ matrix.os }}
          path: galata/test-results
          if-no-files-found: ignore
